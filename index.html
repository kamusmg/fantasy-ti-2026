    <!--
      Preview de link. Sem isto, o link colado no Discord/WhatsApp vira um
      retangulo cinza e ninguem clica.

      A imagem NAO mostra a resposta. Ela mostrava — os tres times e o titulo,
      gerados pelo motor — e deu errado duas vezes: envelheceu (ficou anunciando
      uma escalacao que o motor nao recomenda mais) e parecia torcida, porque
      repetia a mesma organizacao em duas das tres linhas. O site COMPARA
      escalacoes de varios autores com a mesma regua; o cartao de visita nao pode
      vestir a camisa de nenhuma. Agora ele diz o que o site FAZ.

      O `?v=` existe pra furar cache de scraper: Discord e Twitter guardam a
      imagem pela URL, entao trocar so os bytes do arquivo mantem a antiga no ar.
      Se a imagem mudar de novo, suba o numero.
    -->
